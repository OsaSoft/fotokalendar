# Nastavení kalendáře
# Upravuj v editoru (uv run app.py) nebo ručně; PDF: uv run kalendar.py
# Při prvním spuštění se tento soubor zkopíruje do kalendar.toml (ten se necommituje).

rok = 2027
format = "A4"
barva_svatku = "#B4472F"
barva_textu = "#2B2B2B"
pozadi = "zadne"   # zadne | konfety | puntiky | vlny | scrapbook | kresbicky

# Rozložení: "1" celá plocha | "2" dvě nad sebou | "2v" dvě vedle sebe |
#            "3" velká nahoře + dvě dole | "3v" velká vlevo + dvě vpravo | "4" mřížka 2×2
# Fotky: "fotky/soubor.jpg" nebo { soubor = "fotky/soubor.jpg", zoom = 1.3, x = 0.4, y = 0.5 }

